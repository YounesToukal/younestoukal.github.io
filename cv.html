<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>cv | Younes Toukal</title>
<link rel="icon" href="./static/images/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --text:#000; --text-light:#828282; --theme:#ea4335;
    --divider:rgba(0,0,0,.1); --hover-fill:rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#171513; --text:#e8eaed; --text-light:#9aa0a6; --theme:#ea4335;
      --divider:rgba(255,255,255,.14); --hover-fill:rgba(255,255,255,.08);
    }
  }
  :root[data-theme="dark"] {
    --bg:#171513; --text:#e8eaed; --text-light:#9aa0a6; --theme:#ea4335;
    --divider:rgba(255,255,255,.14); --hover-fill:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:70px}
  body{
    margin:0; padding-top:56px;
    background:var(--bg); color:var(--text);
    font-family:'Roboto',sans-serif; font-weight:300; font-size:1rem; line-height:1.6;
  }
  a{color:var(--theme); text-decoration:none}
  a:hover{text-decoration:underline}

  .container{max-width:930px; margin:0 auto; padding:0 15px}

  /* Navbar — identical to the main clone page */
  .navbar{
    position:fixed; top:0; left:0; right:0; z-index:100; height:56px;
    background:var(--bg); border-bottom:1px solid var(--divider);
  }
  .navbar .container{display:flex; align-items:center; justify-content:space-between; gap:18px; height:100%}
  .navbar-brand{font-family:'Roboto Slab',serif; font-size:1.15rem; color:var(--text)}
  .navbar-brand:hover{color:var(--theme); text-decoration:none}
  .navbar-brand .bold{font-weight:700}
  .navbar-right{display:flex; align-items:center; gap:18px}
  .navbar-nav{display:flex; gap:26px; list-style:none; margin:0; padding:0}
  .navbar-nav a{color:var(--text); font-size:.95rem}
  .navbar-nav .active a{color:var(--theme); font-weight:700}
  .navbar-nav a:hover{color:var(--theme); text-decoration:none}

  .theme-toggle{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; padding:0; border:0; border-radius:50%;
    background:transparent; color:var(--text-light); cursor:pointer;
  }
  .theme-toggle:hover{background:var(--hover-fill); color:var(--text)}
  .theme-toggle svg{width:19px; height:19px}
  .theme-toggle .icon-sun{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .theme-toggle .icon-moon{display:none; fill:currentColor}
  :root[data-theme="dark"] .theme-toggle .icon-sun{display:none}
  :root[data-theme="dark"] .theme-toggle .icon-moon{display:block}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:none}
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{display:block}
  }

  progress{position:fixed; left:0; top:56px; z-index:10; width:100%; height:2px; appearance:none; border:0; background:transparent; color:var(--theme)}
  progress::-webkit-progress-bar{background:transparent}
  progress::-webkit-progress-value{background:var(--theme)}
  progress::-moz-progress-bar{background:var(--theme)}

  .main{max-width:930px; margin:56px auto 0; padding:0 15px 90px}

  .post-title{
    display:flex; align-items:center; justify-content:space-between;
    font-family:'Roboto Slab',serif; font-size:2.2rem; font-weight:400;
    margin:0 0 40px; padding-bottom:20px; border-bottom:1px solid var(--divider);
  }
  .pdf-link{
    display:inline-flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--text-light); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em;
  }
  .pdf-link:hover{color:var(--theme); text-decoration:none}

  /* Responsive — brand + full nav + toggle all share one 56px-tall
     row here, which overflows a phone-width screen unless it shrinks
     (and, past a point, drops the brand — the "about" link does the
     same job of getting back to the main page). */
  @media (max-width:680px){
    .navbar .container{gap:8px}
    .navbar-brand{font-size:.95rem}
    .navbar-right{gap:10px}
    .navbar-nav{gap:10px}
    .navbar-nav a{font-size:.78rem}
    .theme-toggle{width:32px; height:32px}
    .post-title{font-size:1.7rem; margin-bottom:28px; padding-bottom:14px}
  }
  @media (max-width:420px){
    .navbar-brand{display:none}
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a class="navbar-brand" href="./index.html#about"><span class="bold">Younes</span> Toukal</a>
    <div class="navbar-right">
      <ul class="navbar-nav">
        <li><a href="./index.html#about">about</a></li>
        <li><a href="./index.html#news">news</a></li>
        <li><a href="./index.html#work">work</a></li>
        <li><a href="./index.html#activities">activities</a></li>
        <li class="active"><a href="./cv.html">cv</a></li>
      </ul>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20.7 15.6A9 9 0 1 1 8.4 3.3a7 7 0 0 0 12.3 12.3z"/></svg>
      </button>
    </div>
  </div>
</nav>
<progress id="progress" value="0" max="100"></progress>

<div class="main">
  <div class="post">
    <header>
      <h1 class="post-title">
        cv
        <a class="pdf-link" href="./static/pdfs/CV.pdf" target="_blank" rel="noopener noreferrer" title="Download PDF">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM8 13h2.2a2 2 0 1 1 0 4H8v3H6.6v-8H8v1zm0 1.3v1.4h2.2a.7.7 0 1 0 0-1.4H8zM13 12h1.4v8H13v-8zm3 0h3.5v1.3H17.4V15h2v1.3h-2V20H16v-8z"/></svg>
          <span>PDF</span>
        </a>
      </h1>
    </header>

    <article>
      <div class="cv">
      </div>
    </article>
  </div>
</div>

<script>
  (function () {
    var bar = document.getElementById('progress');
    function update() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.value = h > 0 ? (window.scrollY / h) * 100 : 0;
    }
    document.addEventListener('scroll', update);
    window.addEventListener('resize', update);
    update();
  })();

  (function () {
    var btn = document.querySelector('.theme-toggle');
    if (!btn) return;
    var root = document.documentElement;
    btn.addEventListener('click', function () {
      var current = root.getAttribute('data-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
