<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     role="img" aria-label="Generative models from the ground up — placeholder graphic">
  <!-- PLACEHOLDER — original abstract artwork standing in for a real photo/figure.
       Replace with a real image (jpg/png) and update the <img src> in index.html. -->
  <defs>
    <linearGradient id="denoise" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2c2b"/>
      <stop offset="55%" stop-color="#873d32"/>
      <stop offset="100%" stop-color="#ffc068"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#denoise)"/>
  <!-- noise fading to smooth left-to-right, evoking a diffusion denoising pass -->
  <rect width="640" height="360" filter="url(#grain)" opacity="0.5"/>
  <rect width="320" height="360" fill="url(#denoise)" opacity="0.9"/>
  <rect width="320" height="360" filter="url(#grain)" opacity="0.9"/>
  <rect x="320" width="320" height="360" fill="#00000000"/>
  <!-- soft circular form emerging on the clean (right) side -->
  <circle cx="470" cy="185" r="70" fill="#fbfaf6" opacity="0.14"/>
  <circle cx="470" cy="185" r="40" fill="#fbfaf6" opacity="0.18"/>
</svg>
