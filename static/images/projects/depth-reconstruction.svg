<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     role="img" aria-label="Depth and 3D reconstruction in an operating room — placeholder graphic">
  <!-- PLACEHOLDER — original abstract artwork standing in for a real photo/figure.
       Replace with a real image (jpg/png) and update the <img src> in index.html. -->
  <defs>
    <radialGradient id="fisheyeBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3a3630"/>
      <stop offset="100%" stop-color="#171513"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#fisheyeBg)"/>
  <!-- fisheye-distorted grid: concentric rings + radiating lines -->
  <g stroke="#e0e5d8" stroke-opacity="0.35" fill="none">
    <circle cx="320" cy="180" r="40"/>
    <circle cx="320" cy="180" r="85"/>
    <circle cx="320" cy="180" r="135"/>
    <circle cx="320" cy="180" r="195"/>
  </g>
  <g stroke="#e0e5d8" stroke-opacity="0.28">
    <line x1="320" y1="180" x2="320" y2="-40"/>
    <line x1="320" y1="180" x2="320" y2="400"/>
    <line x1="320" y1="180" x2="60" y2="20"/>
    <line x1="320" y1="180" x2="580" y2="20"/>
    <line x1="320" y1="180" x2="60" y2="340"/>
    <line x1="320" y1="180" x2="580" y2="340"/>
    <line x1="320" y1="180" x2="20" y2="180"/>
    <line x1="320" y1="180" x2="620" y2="180"/>
  </g>
  <!-- reconstructed point cluster, warm accent against the cool wide-angle field -->
  <g fill="#ffc068" opacity="0.85">
    <circle cx="300" cy="165" r="3"/>
    <circle cx="330" cy="150" r="2.4"/>
    <circle cx="345" cy="185" r="3"/>
    <circle cx="310" cy="200" r="2.2"/>
    <circle cx="355" cy="160" r="2"/>
    <circle cx="285" cy="190" r="2.6"/>
  </g>
</svg>
